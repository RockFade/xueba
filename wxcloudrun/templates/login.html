<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学霸后台登录</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Microsoft YaHei", sans-serif; background: #f4f0e7; color: #25211d; }
    form { width: 320px; padding: 24px; border: 1px solid #ddd2c2; border-radius: 8px; background: #fffdf8; }
    h1 { margin: 0 0 18px; font-size: 20px; }
    input { width: 100%; height: 40px; box-sizing: border-box; border: 1px solid #cfc4b3; border-radius: 6px; padding: 0 10px; }
    button { width: 100%; height: 40px; margin-top: 14px; border: 0; border-radius: 6px; background: #d96a35; color: white; font-weight: 700; cursor: pointer; }
    .error { margin: 10px 0 0; color: #b94b34; font-size: 13px; }
  </style>
</head>
<body>
  <form method="post">
    <h1>学霸关卡后台</h1>
    <input type="password" name="password" placeholder="后台密码" autofocus>
    <button type="submit">登录</button>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </form>
</body>
</html>
