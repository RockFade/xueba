<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关卡编辑</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --soft: #f3f4f6;
      --primary: #07c160;
      --primary-dark: #05934a;
      --accent: #f97316;
      --danger: #dc2626;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 12px;
      background: var(--panel);
      color: var(--text);
      font-weight: 650;
      cursor: pointer;
    }
    button:hover { border-color: #cbd5e1; background: #f9fafb; }
    button.primary { border-color: var(--primary); background: var(--primary); color: #fff; }
    button.primary:hover { border-color: var(--primary-dark); background: var(--primary-dark); }
    button.ghost { background: transparent; }
    button.danger { color: var(--danger); }
    button:disabled { cursor: not-allowed; opacity: .55; }

    input {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 10px;
      background: var(--panel);
      color: var(--text);
      outline: none;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(7, 193, 96, .12); }
    label { display: block; margin-bottom: 14px; font-size: 12px; color: var(--muted); }
    label span { display: block; margin-bottom: 6px; font-weight: 650; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(10px);
    }
    .title { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .title strong { font-size: 17px; white-space: nowrap; }
    .badge {
      display: inline-flex;
      align-items: center;
      height: 24px;
      border-radius: 999px;
      padding: 0 9px;
      background: #eef2ff;
      color: #4338ca;
      font-size: 12px;
      font-weight: 700;
    }
    .badge.published { background: #dcfce7; color: #15803d; }
    .badge.draft { background: #f3f4f6; color: #4b5563; }
    .top-actions { display: flex; align-items: center; gap: 8px; }

    .layout {
      display: grid;
      grid-template-columns: 280px minmax(460px, 1fr) 360px;
      gap: 16px;
      padding: 16px;
      align-items: start;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
    }
    .panel-head h2 { margin: 0; font-size: 14px; }
    .panel-body { padding: 14px; }

    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-row { display: grid; gap: 8px; margin-top: 12px; }
    .stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 10px;
      border-radius: 8px;
      background: var(--soft);
      font-size: 13px;
    }
    .stat b { color: var(--text); }
    .notice {
      min-height: 36px;
      margin-top: 12px;
      padding: 9px 10px;
      border-radius: 8px;
      background: #fff7ed;
      color: #9a3412;
      font-size: 13px;
      line-height: 1.45;
    }

    .workspace { min-height: calc(100vh - 92px); }
    .char-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .char-tabs button {
      min-width: 44px;
      height: 38px;
      border-radius: 9px;
      font-size: 18px;
      background: var(--soft);
    }
    .char-tabs button.on { border-color: var(--primary); background: #e8fff2; color: #04753b; }
    .char-tabs small { display: block; margin-top: -3px; font-size: 10px; color: var(--muted); }

    .stage-wrap { display: grid; place-items: center; padding: 16px 0 12px; }
    .stage {
      position: relative;
      width: min(62vh, 560px);
      max-width: 100%;
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 12px;
      background:
        linear-gradient(#f1f5f9 1px, transparent 1px),
        linear-gradient(90deg, #f1f5f9 1px, transparent 1px),
        #fff;
      background-size: 32px 32px;
      overflow: hidden;
    }
    .stage.empty {
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }
    .stage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }
    .full { opacity: .30; filter: grayscale(1) contrast(.9); }
    .stroke {
      opacity: 0;
      filter:
        brightness(0) saturate(100%) invert(52%) sepia(93%) saturate(1199%)
        hue-rotate(346deg) brightness(101%) contrast(95%)
        drop-shadow(0 0 8px rgba(249, 115, 22, .45));
    }
    .stroke.on { opacity: .96; }
    .stroke.hover { opacity: .42; }

    .stroke-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 4px;
    }
    .stroke-buttons { display: flex; flex-wrap: wrap; gap: 7px; }
    .stroke-buttons button {
      width: 34px;
      height: 32px;
      padding: 0;
      border-radius: 8px;
      background: var(--soft);
    }
    .stroke-buttons button.on { border-color: var(--accent); background: #ffedd5; color: #c2410c; }
    .stroke-buttons button.hover { border-color: #fdba74; }
    .status-text { color: var(--muted); font-size: 12px; white-space: nowrap; }

    .selection-card {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px;
      background: #fafafa;
      margin-bottom: 12px;
    }
    .selection-title { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      min-width: 32px;
      height: 28px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 8px;
      background: #fff;
      color: #374151;
      font-size: 12px;
      font-weight: 750;
    }
    .chip.on { border-color: var(--accent); background: #ffedd5; color: #c2410c; }
    .muted { color: var(--muted); font-size: 13px; }

    .answer-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .answer-list { display: grid; gap: 9px; margin-top: 14px; }
    .answer-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #fff;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    .answer-card:hover { border-color: #cbd5e1; box-shadow: 0 6px 18px rgba(15, 23, 42, .06); transform: translateY(-1px); }
    .answer-card.active { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(7, 193, 96, .12); }
    .answer-main { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .answer-word { font-size: 26px; font-weight: 800; line-height: 1; }
    .answer-meta { color: var(--muted); font-size: 12px; text-align: right; }
    .answer-card .chips { margin-top: 8px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      border-radius: 999px;
      padding: 10px 16px;
      background: rgba(17, 24, 39, .92);
      color: #fff;
      font-size: 13px;
      transition: opacity .18s, transform .18s;
      z-index: 10;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 1120px) {
      .layout { grid-template-columns: 1fr; }
      .workspace { min-height: auto; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="title">
      <a href="/admin/levels">← 关卡</a>
      <strong id="pageTitle">{% if level %}编辑关卡 #{{ level.id }}{% else %}新建关卡{% endif %}</strong>
      <span class="badge draft" id="statusBadge">草稿</span>
    </div>
    <div class="top-actions">
      <button class="ghost" id="previewBtn">预览</button>
      <button id="saveBtn">保存</button>
      <button class="primary" id="publishBtn">发布</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel">
      <div class="panel-head"><h2>关卡信息</h2></div>
      <div class="panel-body">
        <label><span>原文</span>
          <input id="sourceText" value="{% if level %}{{ level.source_text }}{% endif %}" placeholder="明 / 明月 / 一鸣惊人">
        </label>
        <div class="meta-grid">
          <label><span>通关数量</span>
            <input id="passCount" type="number" min="1" value="{% if level %}{{ level.pass_count }}{% else %}1{% endif %}">
          </label>
          <label><span>排序</span>
            <input id="sortOrder" type="number" min="0" value="{% if level %}{{ level.sort_order }}{% else %}0{% endif %}">
          </label>
        </div>
        <button class="primary" id="generateBtn" style="width:100%;">生成/重新生成笔画</button>
        <div class="stat-row">
          <div class="stat"><span>类型</span><b id="typeStat">-</b></div>
          <div class="stat"><span>字符</span><b id="charStat">0</b></div>
          <div class="stat"><span>答案</span><b id="answerStat">0</b></div>
        </div>
        <div class="notice" id="levelStatus">输入原文后生成笔画，再配置答案。</div>
      </div>
    </aside>

    <section class="panel workspace">
      <div class="panel-head">
        <h2>笔画画布</h2>
        <span class="status-text" id="hitStatus">点击字上的笔画或下方编号</span>
      </div>
      <div class="panel-body">
        <div class="char-tabs" id="charTabs"></div>
        <div class="stage-wrap"><div class="stage empty" id="stage">还没有生成笔画<br>先输入原文并点击“生成/重新生成笔画”</div></div>
        <div class="stroke-toolbar">
          <div class="stroke-buttons" id="strokeButtons"></div>
          <button id="clearCurrentBtn">清空当前字</button>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="panel-head"><h2>答案配置</h2></div>
      <div class="panel-body">
        <div class="selection-card">
          <div class="selection-title">
            <span>当前选择</span>
            <button id="clearBtn" style="height:26px;padding:0 8px;">清空全部</button>
          </div>
          <div class="chips" id="selectedChips"><span class="muted">未选择</span></div>
        </div>
        <label><span>答案字</span>
          <input id="answerWord" placeholder="日，回车添加">
        </label>
        <div class="answer-actions">
          <button id="fillFromAnswerBtn">回显选中答案</button>
          <button class="primary" id="addAnswerBtn">添加答案</button>
        </div>
        <div class="answer-list" id="answerList"></div>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    let levelId = {% if level %}{{ level.id }}{% else %}null{% endif %};
    let levelData = null;
    let currentCharId = '';
    let activeAnswerId = '';
    let hoverStrokeId = '';
    const selected = {};
    const hitMasks = new Map();

    const sourceText = document.getElementById('sourceText');
    const passCount = document.getElementById('passCount');
    const sortOrder = document.getElementById('sortOrder');
    const charTabs = document.getElementById('charTabs');
    const stage = document.getElementById('stage');
    const strokeButtons = document.getElementById('strokeButtons');
    const selectedChips = document.getElementById('selectedChips');
    const answerList = document.getElementById('answerList');
    const hitStatus = document.getElementById('hitStatus');
    const levelStatus = document.getElementById('levelStatus');
    const statusBadge = document.getElementById('statusBadge');
    const typeStat = document.getElementById('typeStat');
    const charStat = document.getElementById('charStat');
    const answerStat = document.getElementById('answerStat');
    const answerWord = document.getElementById('answerWord');
    const toast = document.getElementById('toast');

    async function api(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
      });
      const data = await res.json();
      if (data.code !== 0) throw new Error(data.errorMsg || '请求失败');
      return data.data;
    }

    async function loadLevel() {
      if (!levelId) return render();
      levelData = await api(`/api/admin/levels/${levelId}`);
      currentCharId = levelData.chars[0]?.charId || '';
      render();
    }

    async function saveLevel() {
      const payload = {
        sourceText: sourceText.value,
        passCount: Number(passCount.value || 1),
        sortOrder: Number(sortOrder.value || 0)
      };
      if (!payload.sourceText.trim()) throw new Error('原文不能为空');
      if (!levelId) {
        levelData = await api('/api/admin/levels', { method: 'POST', body: JSON.stringify(payload) });
        levelId = levelData.id;
        history.replaceState(null, '', `/admin/levels/${levelId}`);
      } else {
        levelData = await api(`/api/admin/levels/${levelId}`, { method: 'PUT', body: JSON.stringify(payload) });
      }
      currentCharId = levelData.chars[0]?.charId || currentCharId;
      setStatus('已保存草稿');
      render();
    }

    async function generateStrokes() {
      if (levelData?.answers?.length) {
        const ok = confirm('重新生成笔画会清空当前字形素材，已配置答案可能需要重新检查。继续吗？');
        if (!ok) return;
      }
      if (!levelId) await saveLevel();
      setStatus('正在生成笔画...');
      levelData = await api(`/api/admin/levels/${levelId}/generate`, { method: 'POST', body: '{}' });
      currentCharId = levelData.chars[0]?.charId || '';
      Object.keys(selected).forEach((key) => selected[key].clear());
      hitMasks.clear();
      setStatus(`生成成功：${levelData.chars.length} 个字，共 ${levelData.chars.reduce((sum, item) => sum + item.strokeCount, 0)} 笔`);
      render();
    }

    async function addAnswer() {
      if (!levelId || !levelData?.chars?.length) throw new Error('请先保存并生成笔画');
      const word = answerWord.value.trim();
      const parts = getSelectedParts();
      if (!word) throw new Error('请输入答案字');
      if (!parts.length) throw new Error('请先选择笔画');
      const duplicate = findDuplicateSelection(parts);
      if (duplicate && !confirm(`这组笔画已经配置为「${duplicate.word}」，仍然继续添加吗？`)) return;
      levelData = await api(`/api/admin/levels/${levelId}/answers`, {
        method: 'POST',
        body: JSON.stringify({ word, parts })
      });
      clearSelection();
      answerWord.value = '';
      activeAnswerId = '';
      setStatus(`已添加答案：${word}`);
      render();
    }

    async function publishLevel() {
      if (!levelId) throw new Error('请先保存关卡');
      if (!levelData?.chars?.length) throw new Error('请先生成笔画');
      if (!levelData?.answers?.length) throw new Error('请至少配置一个答案');
      if (Number(passCount.value || 1) > levelData.answers.length) throw new Error('通关数量不能大于答案数量');
      levelData = await api(`/api/admin/levels/${levelId}/publish`, { method: 'POST', body: '{}' });
      setStatus('已发布');
      render();
    }

    function render() {
      sourceText.value = levelData?.sourceText || sourceText.value;
      passCount.value = levelData?.passCount || passCount.value || 1;
      sortOrder.value = levelData?.sortOrder || sortOrder.value || 0;
      typeStat.textContent = typeLabel(levelData?.type || inferType(sourceText.value));
      charStat.textContent = levelData?.chars?.length || 0;
      answerStat.textContent = levelData?.answers?.length || 0;
      const status = levelData?.status || 'draft';
      statusBadge.textContent = status === 'published' ? '已发布' : '草稿';
      statusBadge.className = `badge ${status === 'published' ? 'published' : 'draft'}`;
      renderChars();
      renderAnswers();
      renderSelected();
    }

    function renderChars() {
      charTabs.innerHTML = '';
      stage.innerHTML = '';
      strokeButtons.innerHTML = '';
      stage.className = 'stage';
      if (!levelData?.chars?.length) {
        stage.className = 'stage empty';
        stage.innerHTML = '还没有生成笔画<br>先输入原文并点击“生成/重新生成笔画”';
        return;
      }
      if (!currentCharId) currentCharId = levelData.chars[0].charId;
      const current = levelData.chars.find((item) => item.charId === currentCharId) || levelData.chars[0];
      currentCharId = current.charId;
      levelData.chars.forEach((item) => {
        const btn = document.createElement('button');
        const count = getSelectedSet(item.charId).size;
        btn.innerHTML = `${item.char}<small>${count}/${item.strokeCount}</small>`;
        btn.className = item.charId === currentCharId ? 'on' : '';
        btn.onclick = () => { currentCharId = item.charId; hoverStrokeId = ''; render(); };
        charTabs.appendChild(btn);
      });

      const full = document.createElement('img');
      full.className = 'full';
      full.src = current.fullImage;
      stage.appendChild(full);
      current.strokes.forEach((stroke) => {
        const selectedNow = getSelectedSet(currentCharId).has(stroke.id);
        const img = document.createElement('img');
        img.className = `stroke ${selectedNow ? 'on' : ''} ${hoverStrokeId === stroke.id && !selectedNow ? 'hover' : ''}`;
        img.dataset.id = stroke.id;
        img.src = stroke.image;
        stage.appendChild(img);

        const btn = document.createElement('button');
        btn.textContent = stroke.index;
        btn.className = `${selectedNow ? 'on' : ''} ${hoverStrokeId === stroke.id ? 'hover' : ''}`;
        btn.onmouseenter = () => { hoverStrokeId = stroke.id; renderChars(); };
        btn.onmouseleave = () => { hoverStrokeId = ''; renderChars(); };
        btn.onclick = () => toggleStroke(currentCharId, stroke.id);
        strokeButtons.appendChild(btn);
      });
      buildMasks(current);
    }

    function renderSelected() {
      const parts = getSelectedParts();
      if (!parts.length) {
        selectedChips.innerHTML = '<span class="muted">未选择</span>';
        return;
      }
      selectedChips.innerHTML = parts.map((part) => {
        const char = levelData.chars.find((item) => item.charId === part.charId)?.char || part.charId;
        return part.strokeIds.map((id) => `<span class="chip on">${char}:${id.slice(1)}</span>`).join('');
      }).join('');
    }

    function renderAnswers() {
      const answers = levelData?.answers || [];
      answerList.innerHTML = answers.length ? answers.map((answer) => `
        <div class="answer-card ${activeAnswerId === answer.id ? 'active' : ''}" data-id="${answer.id}">
          <div class="answer-main">
            <span class="answer-word">${answer.word}</span>
            <span class="answer-meta">${answer.parts.map((part) => `${charName(part.charId)}:${part.strokeIds.map((id) => id.slice(1)).join(',')}`).join(' + ')}</span>
          </div>
          <div class="chips">${answer.parts.flatMap((part) => part.strokeIds.map((id) => `<span class="chip">${charName(part.charId)}:${id.slice(1)}</span>`)).join('')}</div>
        </div>
      `).join('') : '<div class="muted">还没有答案。选笔画后输入答案字，按 Enter 添加。</div>';
      answerList.querySelectorAll('.answer-card').forEach((card) => {
        card.onclick = () => selectAnswer(card.dataset.id);
      });
    }

    function getSelectedSet(charId) {
      if (!selected[charId]) selected[charId] = new Set();
      return selected[charId];
    }

    function getSelectedParts() {
      return Object.entries(selected)
        .filter(([, ids]) => ids.size)
        .map(([charId, ids]) => ({
          charId,
          strokeIds: Array.from(ids).sort((a, b) => Number(a.slice(1)) - Number(b.slice(1)))
        }));
    }

    function toggleStroke(charId, strokeId) {
      const ids = getSelectedSet(charId);
      if (ids.has(strokeId)) ids.delete(strokeId);
      else ids.add(strokeId);
      activeAnswerId = '';
      render();
    }

    function clearSelection() {
      Object.keys(selected).forEach((key) => selected[key].clear());
    }

    function selectAnswer(answerId) {
      const answer = (levelData?.answers || []).find((item) => item.id === answerId);
      if (!answer) return;
      clearSelection();
      answer.parts.forEach((part) => {
        selected[part.charId] = new Set(part.strokeIds);
      });
      activeAnswerId = answer.id;
      answerWord.value = answer.word;
      currentCharId = answer.parts[0]?.charId || currentCharId;
      setStatus(`已回显答案：${answer.word}`);
      render();
    }

    function fillFromActiveAnswer() {
      if (!activeAnswerId) throw new Error('请先点击答案列表中的一条答案');
      selectAnswer(activeAnswerId);
    }

    function findDuplicateSelection(parts) {
      const key = selectionKey(parts);
      return (levelData?.answers || []).find((answer) => selectionKey(answer.parts) === key);
    }

    function selectionKey(parts) {
      return parts.map((part) => `${part.charId}:${part.strokeIds.slice().sort().join('|')}`).sort().join(';');
    }

    function charName(charId) {
      return levelData?.chars?.find((item) => item.charId === charId)?.char || charId;
    }

    stage.addEventListener('click', (event) => {
      const current = levelData?.chars?.find((item) => item.charId === currentCharId);
      if (!current) return;
      const strokeId = findStrokeAt(current, event);
      if (!strokeId) {
        hitStatus.textContent = '没有点到笔画';
        return;
      }
      hitStatus.textContent = `已切换第 ${strokeId.slice(1)} 笔`;
      toggleStroke(currentCharId, strokeId);
    });

    stage.addEventListener('mousemove', (event) => {
      const current = levelData?.chars?.find((item) => item.charId === currentCharId);
      if (!current) return;
      const strokeId = findStrokeAt(current, event);
      if (strokeId !== hoverStrokeId) {
        hoverStrokeId = strokeId;
        renderChars();
      }
    });
    stage.addEventListener('mouseleave', () => {
      if (hoverStrokeId) {
        hoverStrokeId = '';
        renderChars();
      }
    });

    async function buildMasks(charData) {
      await Promise.all(charData.strokes.map((stroke) => new Promise((resolve) => {
        const key = `${charData.charId}:${stroke.id}`;
        if (hitMasks.has(key)) return resolve();
        const image = new Image();
        image.crossOrigin = 'anonymous';
        image.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            canvas.width = image.naturalWidth;
            canvas.height = image.naturalHeight;
            ctx.drawImage(image, 0, 0);
            hitMasks.set(key, { width: canvas.width, height: canvas.height, data: ctx.getImageData(0, 0, canvas.width, canvas.height).data });
          } catch (error) {}
          resolve();
        };
        image.onerror = resolve;
        image.src = stroke.image;
      })));
    }

    function findStrokeAt(charData, event) {
      const rect = stage.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width;
      const y = (event.clientY - rect.top) / rect.height;
      if (x < 0 || x > 1 || y < 0 || y > 1) return '';
      for (let i = charData.strokes.length - 1; i >= 0; i -= 1) {
        const stroke = charData.strokes[i];
        const mask = hitMasks.get(`${charData.charId}:${stroke.id}`);
        if (mask) {
          const px = Math.min(mask.width - 1, Math.max(0, Math.floor(x * mask.width)));
          const py = Math.min(mask.height - 1, Math.max(0, Math.floor(y * mask.height)));
          if (mask.data[(py * mask.width + px) * 4 + 3] > 18) return stroke.id;
        } else if (stroke.bounds && x >= stroke.bounds.x && x <= stroke.bounds.x + stroke.bounds.w && y >= stroke.bounds.y && y <= stroke.bounds.y + stroke.bounds.h) {
          return stroke.id;
        }
      }
      return '';
    }

    function inferType(value) {
      const text = (value || '').trim();
      if (text.length <= 1) return 'single';
      if (text.length === 4) return 'idiom';
      return 'multi';
    }

    function typeLabel(value) {
      return { single: '单字', multi: '多字', idiom: '成语' }[value] || '-';
    }

    function setStatus(message) {
      levelStatus.textContent = message;
      showToast(message);
    }

    let toastTimer = null;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    document.getElementById('saveBtn').onclick = () => saveLevel().catch((e) => alert(e.message));
    document.getElementById('generateBtn').onclick = () => generateStrokes().catch((e) => { levelStatus.textContent = e.message; alert(e.message); });
    document.getElementById('addAnswerBtn').onclick = () => addAnswer().catch((e) => alert(e.message));
    document.getElementById('publishBtn').onclick = () => publishLevel().catch((e) => alert(e.message));
    document.getElementById('clearBtn').onclick = () => { clearSelection(); activeAnswerId = ''; answerWord.value = ''; render(); };
    document.getElementById('clearCurrentBtn').onclick = () => { getSelectedSet(currentCharId).clear(); activeAnswerId = ''; render(); };
    document.getElementById('fillFromAnswerBtn').onclick = () => fillFromActiveAnswer().catch((e) => alert(e.message));
    document.getElementById('previewBtn').onclick = () => alert('预览模式下一版接入。当前可通过点击答案列表回显验证配置。');
    answerWord.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') addAnswer().catch((e) => alert(e.message));
      if (event.key === 'Escape') { clearSelection(); activeAnswerId = ''; render(); }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') { clearSelection(); activeAnswerId = ''; answerWord.value = ''; render(); }
    });

    loadLevel().catch((e) => alert(e.message));
  </script>
</body>
</html>
